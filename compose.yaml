services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: event_management
      POSTGRES_USER: event_management
      POSTGRES_PASSWORD: event_management
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_management -d event_management"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
