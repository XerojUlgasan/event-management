# Supabase CLI reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "clemora"

# Required services: PostgreSQL, Kong gateway, Storage, and Edge Runtime.
# package.json excludes PostgREST, database metadata, and image proxy.
[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17
orioledb_version = ""

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Kong exposes our Edge API and Storage on port 54321.
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[storage]
enabled = true
file_size_limit = "50MiB"

# Private catalog uploads use catalog-media/<id> object keys.
[storage.buckets.event-management]
public = false
file_size_limit = "25MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "video/mp4", "video/webm"]

[storage.s3_protocol]
enabled = true

# Use oneshot: hot reload previously killed this large bundle with exit 137.
[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
deno_version = 2

[functions.api]
verify_jwt = false
entrypoint = "./functions/api/index.ts"

# Optional services are disabled explicitly; commenting out their switches can restore defaults.
[analytics]
enabled = false
# port = 54327
# backend = "postgres"

[studio]
enabled = false
# port = 54323
# api_url = "http://127.0.0.1"
# openai_api_key = "env(OPENAI_API_KEY)"

[realtime]
enabled = false

[local_smtp]
enabled = false
# port = 54324

